# Fly.io कॉन्फिग. app नाव बदला (जगात एकमेव हवे): fly launch --copy-config
app = "kon-ahe-imposter"
primary_region = "bom"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "gamedata"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
